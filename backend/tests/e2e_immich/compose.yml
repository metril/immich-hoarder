# End-to-end stack: real Immich + mock OIDC + fixture site + the hoarder image under test.
# No fixed host ports; the test reads the ephemeral ones back with `docker compose port`.
name: ih-e2e

services:
  redis:
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: '--data-checksums'
    shm_size: 128mb
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      disable: false

  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.3.1@sha256:db996e352359771c6a3db121a0ed8761516b22f727fc092a0f46dcfef82c1bc1
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
      IMMICH_MACHINE_LEARNING_ENABLED: "false"
    tmpfs:
      - /data
    ports:
      - "127.0.0.1::2283"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: false

  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.5@sha256:5ed2f078c6503147860a5114f06414257bb7eeccc68b0e806bdf0869f2602509
    environment:
      JSON_CONFIG_PATH: /cfg/mock-oidc.json
    volumes:
      - ./mock-oidc.json:/cfg/mock-oidc.json:ro
    ports:
      - "127.0.0.1::8080"

  site:
    image: nginx:1.30.6-alpine@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
    volumes:
      - ${IH_E2E_SITE_DIR:?set IH_E2E_SITE_DIR}:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  hoarder:
    image: ${IH_E2E_IMAGE:-immich-hoarder:e2e}
    pull_policy: never
    read_only: true
    tmpfs:
      - /scratch:uid=10001,gid=10001
      - /tmp
      - /data:uid=10001,gid=10001
    ports:
      - "127.0.0.1::8080"
    environment:
      IH_PUBLIC_URL: http://localhost
      IH_SESSION_SECRET: e2e-session-secret-0123456789abcdef0123
      IH_MASTER_KEY: e2e-master-key-0123456789abcdef012345678
      IH_OIDC_ISSUER: http://oidc:8080/default
      IH_OIDC_CLIENT_ID: immich-hoarder
      IH_OIDC_CLIENT_SECRET: e2e-client-secret-not-used-0000000000
    depends_on:
      immich-server:
        condition: service_healthy
      oidc:
        condition: service_started
      site:
        condition: service_started

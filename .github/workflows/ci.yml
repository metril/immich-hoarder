name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.skip.outputs.skip }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      # Release-PR skip rule: skip all jobs only when the PR comes from this
      # repo (not a fork) AND every changed file is in the release-please
      # allowlist. Branch names are never trusted.
      - uses: dorny/paths-filter@v3
        id: rel
        with:
          predicate-quantifier: every
          filters: |
            # With 'every' a file must match ALL patterns: true only for files
            # OUTSIDE the allowlist.
            non_release:
              - '**'
              - '!CHANGELOG.md'
              - '!.release-please-manifest.json'
              - '!backend/app/_version.py'
              - '!version.txt'
      - uses: actions/checkout@v4
      - name: Verify version file is release-only
        run: |
          if [[ "$(grep -cv '^\s*$' backend/app/_version.py)" != "1" ]] \
            || ! grep -qxE '__version__ = "[^"]+"  # x-release-please-version' backend/app/_version.py; then
            echo "backend/app/_version.py must contain only the __version__ line"
            exit 1
          fi
      - id: skip
        env:
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          NON_RELEASE: ${{ steps.rel.outputs.non_release }}
        run: |
          if [[ "$SAME_REPO" == "true" && "$NON_RELEASE" == "false" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - 'backend/**'
              - 'frontend/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'compose.example.yml'
              - 'deploy/**'
              - '.github/workflows/ci.yml'

  backend-lint:
    needs: changes
    if: needs.changes.outputs.skip != 'true' && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  backend:
    needs: changes
    if: needs.changes.outputs.skip != 'true' && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      # -n auto comes from addopts; pytest-split divides tests across shards.
      - run: uv run pytest -q --splits 4 --group ${{ matrix.shard }}

  postgres:
    needs: changes
    if: needs.changes.outputs.skip != 'true' && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IH_TEST_PG_URL: postgresql://postgres:pg@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -m pg -q

  frontend:
    needs: changes
    if: needs.changes.outputs.skip != 'true' && needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile && pnpm lint && pnpm typecheck && pnpm build && pnpm budget

  frontend-test:
    needs: changes
    if: needs.changes.outputs.skip != 'true' && needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile && pnpm test --shard=${{ matrix.shard }}/2

  api-client:
    needs: changes
    if: needs.changes.outputs.skip != 'true' && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Dump OpenAPI
        working-directory: backend
        run: uv sync --frozen && uv run python -m app.openapi_dump ../frontend/openapi.json
      - name: Generate client
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm gen:api
      - name: Check generated client is current
        run: |
          git diff --exit-code -- frontend/openapi.json frontend/src/api/schema.d.ts || { echo "Generated API client is stale: run app.openapi_dump + pnpm gen:api"; exit 1; }

  frontend-e2e:
    needs: changes
    if: needs.changes.outputs.skip != 'true' && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: uv sync --frozen
      - name: Install and build
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm build && pnpm exec playwright install --with-deps chromium
      - name: Playwright smoke
        working-directory: frontend
        run: pnpm e2e
      - name: Lighthouse
        working-directory: frontend
        run: |
          (cd ../backend && uv run python -m tests.e2e_server) &
          ok=
          for _ in $(seq 60); do curl -sf http://127.0.0.1:8090/healthz >/dev/null && ok=1 && break; sleep 1; done
          [ -n "$ok" ] || { echo "e2e server did not become healthy"; exit 1; }
          CHROME_PATH="$(node -e "import('@playwright/test').then(m=>console.log(m.chromium.executablePath()))")" pnpm lhci
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-e2e-reports
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/.lighthouseci/
          if-no-files-found: ignore

  docker:
    needs: changes
    if: needs.changes.outputs.skip != 'true' && needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          mkdir -p secrets && for s in ih_master_key ih_session_secret ih_oidc_client_secret ih_db_url ih_pg_password; do echo x > secrets/$s; done
          docker network create traefik
          export VPN_SERVICE_PROVIDER=custom
          docker compose -f compose.example.yml config -q
          docker compose -f compose.example.yml -f deploy/compose.postgres.yml config -q
          docker compose -f compose.example.yml -f deploy/compose.gluetun.yml config -q
          docker compose -f compose.example.yml -f deploy/compose.postgres.yml -f deploy/compose.gluetun.yml config -q
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-arm64:
    needs: changes
    if: needs.changes.outputs.skip != 'true' && needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: immich-hoarder:ci-arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
      - name: Smoke-run image
        run: docker run --rm immich-hoarder:ci-arm64 python -c "import app"

  e2e-immich:
    needs: changes
    if: needs.changes.outputs.skip != 'true' && needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: immich-hoarder:e2e
          cache-from: type=gha
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: E2E against real Immich
        env:
          IH_E2E_IMMICH: "1"
          IH_E2E_LOG_DIR: ${{ runner.temp }}/e2e
        run: uv run pytest backend/tests/e2e_immich -n 0 -q
      # The fixture tears down itself; this removes anything left by a killed run.
      - name: Tear down leftover stacks
        if: always()
        run: |
          for p in $(docker ps -a --filter label=com.docker.compose.project --format '{{.Label "com.docker.compose.project"}}' | grep '^ih-e2e-' | sort -u); do
            docker compose -p "$p" down -v --remove-orphans || true
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-immich-logs
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore

  ci-ok:
    if: always()
    needs: [changes, backend-lint, backend, postgres, frontend, frontend-test, api-client, frontend-e2e, docker, docker-arm64, e2e-immich]
    runs-on: ubuntu-latest
    steps:
      - name: Verify no job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more required jobs failed or were cancelled"
          exit 1

name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.skip.outputs.skip }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      # Release-PR skip rule: skip all jobs only when the PR comes from this
      # repo (not a fork) AND every changed file is in the release-please
      # allowlist. Branch names are never trusted.
      - uses: dorny/paths-filter@v3
        id: rel
        with:
          predicate-quantifier: every
          filters: |
            # With 'every' a file must match ALL patterns: true only for files
            # OUTSIDE the allowlist.
            non_release:
              - '**'
              - '!CHANGELOG.md'
              - '!.release-please-manifest.json'
              - '!backend/app/__init__.py'
              - '!version.txt'
      - id: skip
        env:
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          NON_RELEASE: ${{ steps.rel.outputs.non_release }}
        run: |
          if [[ "$SAME_REPO" == "true" && "$NON_RELEASE" == "false" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - 'backend/**'
              - 'frontend/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.skip != 'true' && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q

  docker:
    needs: changes
    if: needs.changes.outputs.skip != 'true' && needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ci-ok:
    if: always()
    needs: [changes, backend, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Verify no job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more required jobs failed or were cancelled"
          exit 1

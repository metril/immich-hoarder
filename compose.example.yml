services:
  immich-hoarder:
    image: ghcr.io/metril/immich-hoarder:latest
    restart: unless-stopped
    # Time for running jobs to cancel gracefully and be finalized before SIGKILL.
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /scratch:size=4g,uid=10001,gid=10001
      - /tmp
    volumes:
      - ih_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # No host ports: Traefik reaches the app over the external `traefik` network.
    # `default` lets overrides (postgres, gluetun) be reached by service name.
    networks:
      - default
      - traefik
    environment:
      # OIDC redirect URI to register at your IdP:
      #   https://hoarder.example.com/api/v1/auth/callback
      IH_PUBLIC_URL: https://hoarder.example.com
      IH_SESSION_SECRET_FILE: /run/secrets/ih_session_secret
      IH_MASTER_KEY_FILE: /run/secrets/ih_master_key
      IH_OIDC_ISSUER: https://auth.example.com/application/o/hoarder/
      # Paste the client ID Authentik shows for the provider (not this example value).
      IH_OIDC_CLIENT_ID: immich-hoarder
      IH_OIDC_CLIENT_SECRET_FILE: /run/secrets/ih_oidc_client_secret
      IH_OIDC_ADMIN_GROUPS: '["hoarder-admins"]'
      IH_OIDC_USER_GROUPS: '["hoarder-users"]'
      # Proxy trust is controlled only by uvicorn's FORWARDED_ALLOW_IPS (comma-separated IPs/CIDRs).
      # Set it to the subnet of the external `traefik` network, e.g. created with:
      #   docker network create --subnet 172.30.0.0/16 traefik
      FORWARDED_ALLOW_IPS: 172.30.0.0/16
    secrets:
      - ih_master_key
      - ih_session_secret
      - ih_oidc_client_secret
    labels:
      - traefik.enable=true
      - traefik.http.routers.hoarder.rule=Host(`hoarder.example.com`)
      - traefik.http.routers.hoarder.entrypoints=websecure
      - traefik.http.routers.hoarder.tls.certresolver=letsencrypt
      - traefik.http.services.hoarder.loadbalancer.server.port=8080
      - traefik.docker.network=traefik

# Already running Traefik? Attach it to the `traefik` network and skip this.
# Otherwise add a minimal one under `services:` (mount your acme storage):
#
#  traefik:
#    image: traefik:v3.7.14@sha256:575fa15b135078fe5e50aa847987d96dbddd7b093c172429618404df73f3fa7c
#    restart: unless-stopped
#    command:
#      - --providers.docker=true
#      - --providers.docker.exposedbydefault=false
#      - --entrypoints.websecure.address=:443
#      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
#      - --certificatesresolvers.letsencrypt.acme.email=you@example.com
#      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
#    ports:
#      - "443:443"
#    volumes:
#      - /var/run/docker.sock:/var/run/docker.sock:ro
#      - traefik_acme:/acme
#    networks:
#      - traefik

networks:
  traefik:
    external: true

secrets:
  ih_master_key:
    file: ./secrets/ih_master_key
  ih_session_secret:
    file: ./secrets/ih_session_secret
  ih_oidc_client_secret:
    file: ./secrets/ih_oidc_client_secret

volumes:
  ih_data:

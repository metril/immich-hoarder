[project]
name = "immich-hoarder"
dynamic = ["version"]
description = "Rip images via gallery-dl and upload them to Immich."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "orjson>=3.10",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.13",
    "asyncpg>=0.32.0",
    "cryptography>=43",
    "authlib>=1.9.1",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "pyjwt[crypto]>=2.15.1",
    "argon2-cffi>=25.1.0",
    "croniter>=6.2.4",
    "gallery-dl==1.32.18",
    "pillow>=13.0.0",
    "numpy>=2.5.4",
    "xxhash>=4.0.2",
    "psycopg[binary]>=3.3.6",
    "apprise>=2.1.0",
    "apscheduler>=3.11,<4",
    "sse-starlette>=3.6.0",
    "pyyaml>=6.0.3",
    "prometheus-client>=0.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "respx>=0.23.1",
    "types-croniter>=6.2.4.20261006",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.hatch.version]
path = "backend/app/_version.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["pg: runs against Postgres when IH_TEST_PG_URL is set, otherwise skipped"]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
filterwarnings = [
    "ignore:The httpx module is deprecated; please use httpx2 instead\\.:authlib.deprecate.AuthlibDeprecationWarning",
    "ignore:'imghdr' is deprecated:DeprecationWarning:apprise.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "backend"
packages = ["app"]
plugins = ["pydantic.mypy"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[[tool.mypy.overrides]]
module = ["authlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["gallery_dl", "gallery_dl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true
